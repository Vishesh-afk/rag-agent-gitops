apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rag-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: dockerhub-auth
      containers:
        - name: api
          image: vishesh11/ragagent-backend:a28ecce95e44c97d750efa1e09b861858048272d
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "agent.api:app", "--host", "0.0.0.0", "--port", "8058"]
          ports:
            - name: http
              containerPort: 8058
          env:
            - name: APP_ENV
              value: production
            - name: APP_PORT
              value: "8058"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: vector_db
          envFrom:
            - secretRef:
                name: rag-agent-runtime
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rag-agent
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8058
      targetPort: http
