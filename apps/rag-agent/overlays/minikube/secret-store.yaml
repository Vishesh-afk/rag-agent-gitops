apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: rag-agent
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secrets-manager-auth
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-secrets-manager-auth
            key: secret-access-key
