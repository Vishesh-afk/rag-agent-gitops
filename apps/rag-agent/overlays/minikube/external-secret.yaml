apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-agent-runtime
  namespace: rag-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: rag-agent-runtime
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: rag-agent/minikube/runtime
